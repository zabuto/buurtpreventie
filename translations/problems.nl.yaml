# Titles of API problems (RFC 9457) by code; B1 Dutch, as members read them.
admin_exists: Er is al een beheerder. Een beheerder voegt de volgende toe.
display_name_taken: Een ander lid heeft al deze weergavenaam.
email_address_taken: Een ander lid heeft al dit e-mailadres.
last_admin: Dit is de laatste beheerder. Maak eerst iemand anders beheerder.
member_erased: Dit lid is gewist.
meeting_point_archived: Dit startpunt wordt niet meer gebruikt.
meeting_point_in_use: Er starten nog rondes bij dit startpunt.
meeting_point_name_taken: Er is al een startpunt met deze naam.
outcome_archived: Deze uitkomst wordt niet meer gebruikt.
outcome_name_taken: Er is al een uitkomst met deze naam.
member_inactive: Dit lid is niet actief.
invitee_inactive: Dit lid is niet actief. Een uitnodiging heeft dan geen zin.
round_already_reported: Er is al een terugmelding voor deze ronde.
round_has_started: Deze ronde is al begonnen.
round_is_full: Deze ronde is vol.
round_not_started: Deze ronde is nog niet begonnen.
round_not_walked: Deze ronde is niet gelopen.
start_in_past: Een ronde kan niet in het verleden beginnen.
invalid_phone_number: Dit telefoonnummer klopt niet.
invalid_coordinates: Deze plek op de kaart klopt niet.
empty_comment: Schrijf iets in de opmerking.
invalid_staffing_rule: Het aantal lopers klopt niet. Het maximum moet minstens zo groot zijn als het minimum.
invalid_period: Kies een periode van hooguit drie maanden, met het einde na het begin.
invalid_staffing_defaults: Het aantal lopers klopt niet. Het maximum moet minstens zo groot zijn als het minimum.
insufficient_contrast: Deze kleur is niet goed te zien op de achtergrond. Kies een donkerdere of lichtere kleur.
invalid_color: Een kleur schrijf je als # met zes tekens, bijvoorbeeld #1f5f8b.
invalid_setting: Deze waarde past niet bij deze instelling.
invalid_group_link: Dit is geen uitnodiging voor een groep in WhatsApp of Signal.
invalid_email_address: Dit e-mailadres klopt niet.
invalid_name: Deze naam klopt niet. Gebruik minstens één letter of cijfer.
invalid_token_expiry: Kies een einddatum voor het token binnen 365 dagen.
too_many_entries: Dit zijn te veel regels voor één bestand. Kies een kortere periode, een lid of een actie.
invalid_input: Niet alle gegevens kloppen.
bad_request: Dit verzoek kan de app niet lezen.
login_failed: Het e-mailadres of het wachtwoord klopt niet.
login_code_wrong: Deze code klopt niet.
login_code_ended: Deze code werkt niet meer. Vraag een nieuwe code aan.
invitation_ended: Deze uitnodiging werkt niet meer. Vraag een inlogcode aan, of vraag de beheerder om een nieuwe uitnodiging.
csrf_check_failed: De app kon niet controleren of dit verzoek van deze site komt. Laad de pagina opnieuw en probeer het nog eens.
unauthorized: Je bent niet ingelogd.
insufficient_scope: Je token mag dit niet. Maak een token met de juiste rechten.
browser_only: 'Je tokens beheer je in de app, niet met een token.'
access_denied: Dit mag je niet doen.
reauthentication_required: 'Laat zien dat jij het bent: vul je wachtwoord in, of log opnieuw in met een code.'
not_found: Dit bestaat niet (meer).
method_not_allowed: Dit kan op dit adres niet.
not_acceptable: De app kan dit antwoord niet in die vorm geven.
unsupported_media_type: De app kan dit soort gegevens niet lezen.
too_many_requests: Te veel pogingen. Probeer het later opnieuw.
request_failed: Dit verzoek lukte niet.
internal_error: Er ging iets mis. Probeer het later opnieuw.
