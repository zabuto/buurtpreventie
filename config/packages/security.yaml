security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        members:
            id: App\Identity\Infrastructure\Security\MemberUserProvider

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build)/)
            security: false
        # The MCP server takes API tokens only: a session cookie would let another site act as the member there.
        mcp:
            pattern: ^/mcp(/|$)
            stateless: true
            provider: members
            custom_authenticators:
                - App\Identity\Infrastructure\Security\ApiTokenAuthenticator
        # Every API request with an Authorization header; the authenticator takes each one, so a broken header is
        # refused and logged instead of passing as a request without a session.
        api_token:
            request_matcher: App\Identity\Infrastructure\Security\BearerRequestMatcher
            stateless: true
            provider: members
            custom_authenticators:
                - App\Identity\Infrastructure\Security\ApiTokenAuthenticator
        browser:
            lazy: true
            provider: members
            entry_point: App\Identity\Infrastructure\Security\SessionEntryPoint
            custom_authenticators:
                - App\Identity\Infrastructure\Security\PasswordAuthenticator
                - App\Identity\Infrastructure\Security\LoginCodeAuthenticator
                - App\Identity\Infrastructure\Security\InvitationAuthenticator
                - App\Identity\Infrastructure\Security\ConfirmPasswordAuthenticator
            login_throttling:
                limiter: app.login_rate_limiter
            # "Stay logged in" for 90 days, asked with "rememberMe": true in the body of a login. The cookie is signed
            # with the moment of the last new password, so a new password ends it on every device.
            remember_me:
                secret: '%kernel.secret%'
                name: bp_remember
                lifetime: 7776000
                path: /
                secure: true
                httponly: true
                samesite: lax
                remember_me_parameter: rememberMe
                signature_properties: [credentialsVersion]
            logout:
                path: auth_logout
                delete_cookies:
                    bp_session: { path: '/' }

    # Only the first matching rule applies.
    access_control:
        - { path: ^/api/v1/(health|docs\.json|config|manifest\.webmanifest)$, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/auth/, roles: PUBLIC_ACCESS }
        - { path: ^/api/v1/media/brand/, roles: PUBLIC_ACCESS }
        - { path: ^/api/, roles: IS_AUTHENTICATED }
        - { path: ^/mcp(/|$), roles: IS_AUTHENTICATED }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
