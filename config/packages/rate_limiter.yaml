framework:
    rate_limiter:
        # Failed logins on one address from one IP address.
        login_per_address:
            policy: sliding_window
            limit: 5
            interval: '15 minutes'
            cache_pool: cache.login_attempts
        # Failed logins from one IP address over all addresses, against trying one password on many addresses.
        login_per_ip:
            policy: sliding_window
            limit: 30
            interval: '1 hour'
            cache_pool: cache.login_attempts
        # Requests for a login code for one address, whether it belongs to a member or not.
        login_code_per_address:
            policy: sliding_window
            limit: 3
            interval: '1 hour'
            cache_pool: cache.login_attempts
        # Requests for a login code from one IP address over all addresses.
        # An AI client in a loop would otherwise hammer the server of a small association.
        mcp_per_token:
            policy: sliding_window
            limit: 60
            interval: '1 minute'
            cache_pool: cache.mcp_requests
        login_code_per_ip:
            policy: sliding_window
            limit: 10
            interval: '1 hour'
            cache_pool: cache.login_attempts
