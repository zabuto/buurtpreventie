_security_logout:
    resource: security.route_loader.logout
    type: service

# Answered by the browser firewall (its authenticators and logout), so they have no controller. POST only: a
# login or logout by GET could be set off by any link or image on another site.
auth_login:
    path: /api/v1/auth/login
    methods: [POST]

auth_logout:
    path: /api/v1/auth/logout
    methods: [POST]

auth_login_code_verify:
    path: /api/v1/auth/login-code/verify
    methods: [POST]

auth_invitation:
    path: /api/v1/auth/invitation
    methods: [POST]

auth_confirm:
    path: /api/v1/auth/confirm
    methods: [POST]
