# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # Fallback for URL generation outside a request (console, scheduler); the real base URL goes in .env.local.
    env(DEFAULT_URI): 'http://localhost'
    # Sender of every mail; the real address goes in .env.local.
    env(MAILER_FROM): 'noreply@localhost'
    # Uploaded logo and icon, outside the web folder; an installation sets its own.
    env(UPLOAD_DIR): '%kernel.project_dir%/var/uploads'
    # HSTS stays off until an installation opts in with a max-age in seconds, once HTTPS works there.
    env(HSTS_MAX_AGE): '0'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    # Every absolute link outside a request, such as in a mail, starts at DEFAULT_URI.
    App\Shared\Domain\AppUrl:
        factory: ['App\Shared\Domain\AppUrl', 'fromString']
        arguments: ['%env(DEFAULT_URI)%']

    # Messages leave once the change is committed (AfterCommitNotifier), each by mail (MailNotifier).
    App\Shared\Domain\Notifier: '@App\Shared\Infrastructure\Notification\AfterCommitNotifier'

    # Key of the hash chain in the audit log, apart from APP_SECRET so replacing that leaves the chain intact. No
    # default: without it no audit entry is written, rather than one the chain cannot check.
    App\Audit\Infrastructure\HmacChainHasher:
        arguments: ['%env(AUDIT_SECRET)%']

    # Login throttling (security.yaml): a limit per address and IP address, cleared by a successful login, and a
    # higher limit per IP address that a successful login leaves alone.
    app.login_rate_limiter:
        class: Symfony\Component\Security\Http\RateLimiter\DefaultLoginRateLimiter
        arguments:
            $globalFactory: '@limiter.login_per_ip'
            $localFactory: '@limiter.login_per_address'
            $secret: '%kernel.secret%'

when@test:
    services:
        # Tests assert behaviour; the default logger would print expected errors, such as a 405, between the results.
        logger:
            class: Psr\Log\NullLogger

