rules:
  - id: sql-built-from-strings
    languages: [php]
    severity: ERROR
    message: >-
      SQL built with concatenation, interpolation or sprintf() lets a value change the query. Pass values as
      parameters (`?` or `:name`), or use the query builder with setParameter().
    patterns:
      - pattern-either:
          - pattern: $DB->$METHOD("..." . $VALUE, ...)
          - pattern: $DB->$METHOD($VALUE . "...", ...)
          - pattern: $DB->$METHOD("...$VALUE...", ...)
          - pattern: $DB->$METHOD(sprintf(...), ...)
          - pattern: $DB->$METHOD(\sprintf(...), ...)
      - metavariable-regex:
          metavariable: $METHOD
          regex: ^(executeQuery|executeStatement|executeCacheQuery|executeUpdate|query|exec|prepare|fetchAssociative|fetchNumeric|fetchOne|fetchAllAssociative|fetchAllNumeric|fetchAllKeyValue|fetchFirstColumn|iterateAssociative|iterateNumeric|createQuery|createNativeQuery|where|andWhere|orWhere|having|andHaving|orHaving|orderBy|addOrderBy)$
