rules:
  - id: secret-compared-with-equals
    languages: [php]
    severity: ERROR
    message: >-
      `==`, `===` and strcmp() stop at the first byte that differs, so the response time tells an attacker how much
      of a guessed token, secret or hash is right. Compare with hash_equals(), the known value first.
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: $SECRET == $OTHER
              - pattern: $OTHER == $SECRET
              - pattern: $SECRET === $OTHER
              - pattern: $OTHER === $SECRET
              - pattern: $SECRET != $OTHER
              - pattern: $OTHER != $SECRET
              - pattern: $SECRET !== $OTHER
              - pattern: $OTHER !== $SECRET
          # A check for null, a boolean, a literal or a constant reveals nothing about the secret.
          - metavariable-pattern:
              metavariable: $OTHER
              patterns:
                - pattern-not: "null"
                - pattern-not: "true"
                - pattern-not: "false"
                - pattern-not: '"..."'
                - pattern-not-regex: ^-?\d+$
                - pattern-not: $CLASS::$CONSTANT
          - metavariable-regex:
              metavariable: $SECRET
              regex: (?i)^\$(\w+->)*\w*(token|secret|hash)\w*$
      - patterns:
          - pattern-either:
              - pattern: $FUNCTION($SECRET, ...)
              - pattern: $FUNCTION($OTHER, $SECRET, ...)
          - metavariable-regex:
              metavariable: $FUNCTION
              regex: ^\\?(strcmp|strcasecmp|strncmp|strncasecmp)$
          - metavariable-regex:
              metavariable: $SECRET
              regex: (?i)^\$(\w+->)*\w*(token|secret|hash)\w*$
