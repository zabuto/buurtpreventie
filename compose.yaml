# Development only: production uses the database of the hosting package.
services:
  database:
    # The oldest supported MariaDB LTS line, so local development uses no feature shared hosting lacks.
    image: mariadb:${MARIADB_VERSION:-10.11}
    # The MYSQL_ names, which the image accepts as aliases, are the ones the Symfony CLI reads to build DATABASE_URL.
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-buurtpreventie}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-app}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    # No fixed host port: Docker picks a free one, so other projects on 3306 do not clash.
    ports:
      - '3306'
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - database_data:/var/lib/mysql
      - ./docker/database:/docker-entrypoint-initdb.d:ro

  # Catches every mail the app sends in development, with a web view; nothing leaves the machine. The Symfony CLI
  # reads the SMTP port 1025 of a service named mailer and sets MAILER_DSN, and MAILER_WEB_URL for the web view.
  mailer:
    # A fixed release, not latest, so a hijacked release reaches nobody before the cooldowns of ADR 0004 would.
    image: axllent/mailpit:v1.33.1
    ports:
      - '1025'
      - '8025'
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  database_data:
