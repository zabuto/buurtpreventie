version: 2
updates:
  - package-ecosystem: composer
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    # A hijacked release is usually withdrawn within days; security updates are not subject to the cooldown.
    cooldown:
      semver-patch-days: 7
      semver-minor-days: 7
      semver-major-days: 14
      default-days: 7
    # Patch updates arrive together; minor and major updates arrive one per package, so a red CI run names the package.
    groups:
      patch:
        update-types: [patch]
    ignore:
      # v4 stays on Symfony 7.4 LTS until the planned move to 8.4 LTS; the weekly look-ahead job covers Symfony 8.
      - dependency-name: 'symfony/*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    # Dependabot has no per-update-type cooldown for actions.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
        update-types: [minor, patch]
