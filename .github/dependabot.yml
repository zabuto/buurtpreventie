version: 2
# Every pull request title is a Conventional Commit (pull-request-title.yml); the prefix makes Dependabot's one.
updates:
  - package-ecosystem: composer
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: 'chore(deps)'
    # A hijacked release is usually withdrawn within days; security updates are not subject to the cooldown.
    cooldown:
      semver-patch-days: 7
      semver-minor-days: 7
      semver-major-days: 14
      default-days: 7
    # Patch updates arrive together; minor and major updates arrive one per package, so a red CI run names the package.
    groups:
      patch:
        update-types: [patch]
    ignore:
      # The app stays on Symfony 7.4 LTS until the planned move to 8.4 LTS; the weekly look-ahead job covers Symfony 8.
      - dependency-name: 'symfony/*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: 'chore(deps)'
    # Dependabot has no per-update-type cooldown for actions.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
        update-types: [minor, patch]

  # The service images in compose.yaml, for development only. The database image is chosen through a variable, so
  # Dependabot leaves it alone and it stays on the oldest supported MariaDB LTS line.
  - package-ecosystem: docker-compose
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: 'chore(deps)'
    cooldown:
      default-days: 7
