name: Weekly

on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# An explicit bash shell runs with pipefail, so "| tee" keeps a failing exit code.
defaults:
  run:
    shell: bash

jobs:
  audit:
    name: Security advisories (develop)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          coverage: none
          extensions: intl, mbstring, gd, fileinfo
          tools: composer:v2

      - name: Audit composer.lock
        id: audit
        continue-on-error: true
        run: composer audit --locked --no-interaction 2>&1 | tee report.txt

      - name: Open or update an issue
        if: steps.audit.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: 'Security advisories for packages on develop'
        run: .github/scripts/report-issue.sh

  lookahead:
    name: Look-ahead (Symfony 8, PHP 8.5)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          coverage: none
          extensions: intl, mbstring, gd, fileinfo
          tools: composer:v2

      # Only this job's checkout changes; the 7.4 constraints in the repository stay as they are. Bumping is off here:
      # it would turn "8.*" into "^8.x.y", which SymfonyReleaseLineTest refuses as a constraint outside the release line.
      - name: Require the newest Symfony 8 and drop the PHP 8.4 platform pin
        run: |
          sed -i 's/"7\.4\.\*"/"8.*"/g' composer.json
          composer config --unset platform.php
          composer config bump-after-update false

      - name: Update and run all checks
        id: checks
        continue-on-error: true
        run: |
          {
            composer update --no-interaction --no-progress --with-all-dependencies
            composer check
          } 2>&1 | tee report.txt

      - name: Open or update an issue
        if: steps.checks.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: 'Look-ahead: develop breaks on Symfony 8 or PHP 8.5'
        run: .github/scripts/report-issue.sh

  opengrep-major:
    name: Opengrep major version (develop)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          coverage: none
          extensions: intl, mbstring, gd, fileinfo
          tools: composer:v2

      - name: Generate the autoloader
        run: composer dump-autoload --dev --no-interaction

      # CI never moves to a new Opengrep major by itself; this reports one once it has waited 14 days.
      - name: Check for a new major version
        id: major
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: php tools/opengrep-release.php check-major --fail 2>&1 | tee report.txt

      - name: Open or update an issue
        if: steps.major.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: 'Opengrep: new major version or failed check'
        run: .github/scripts/report-issue.sh
